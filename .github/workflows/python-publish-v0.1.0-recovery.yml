# One-time recovery of the already built, independently reviewed v0.1.0
# artifacts from run 41701850364. Remove this workflow after publication.
name: Publish vetted v0.1.0 artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'repparw/terraform-provider-tplink' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0
          persist-credentials: false

      - name: Assert immutable vetted release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "efb1d084b9f2d11fc407b392bd18608b908daee8"
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "::error::v0.1.0 release already exists"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: repparw/terraform-provider-tplink
          run-id: 41701850364
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Verify exact Alpha-tested release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          from zipfile import ZipFile

          root = Path("dist/release")
          expected = {
              "terraform-provider-tplink_0.1.0_linux_amd64.zip":
                  "b6c91d15bb2ab0751dd6f848de55ac9322221707a4177bd896ad369dfaabbfde",
              "terraform-provider-tplink_0.1.0_darwin_arm64.zip":
                  "b0d864529dad0691828aa06b8c2e7114b37f61b2b2e41bbf35e906a8aca58614",
              "terraform-provider-tplink_0.1.0_windows_amd64.zip":
                  "b95ba6493f417d025f14e2bded40ebb214d7e30eeb8958a62b9e77b1f80155e2",
              "tplink-provider-sources_0.1.0_linux_amd64.zip":
                  "57b23e099192e4756ec2b7e6f87ddb98f9002e50d0119c57644726478b075cfa",
              "tplink-provider-sources_0.1.0_darwin_arm64.zip":
                  "58b5a4809243200f7e505835c95c365673cd63d03dbeff66671df9d6eb7a9a9e",
              "tplink-provider-sources_0.1.0_windows_amd64.zip":
                  "1864ddf0a4d368f0d31cc566800212dfa34afec2662c30ecd247153a451505f5",
          }
          actual = {p.name for p in root.glob("*.zip")}
          if actual != set(expected):
              raise SystemExit(f"Unexpected release archives: {actual ^ set(expected)}")
          for name, digest in expected.items():
              path = root / name
              if sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"Unexpected artifact hash: {name}")
              with ZipFile(path) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit(f"Corrupt archive: {name}")
          with ZipFile(root / "terraform-provider-tplink_0.1.0_linux_amd64.zip") as archive:
              binary = archive.read("terraform-provider-tplink_v0.1.0")
          assert sha256(binary).hexdigest() == (
              "f03a7d24b1af2fb4dd402c7dfa6681d36771b2ee7a464809fe726fbac9ae8f6d"
          ), "Linux binary differs from the Alpha-tested build"
          manifests = list(root.glob("*_manifest.json"))
          assert len(manifests) == 1, "Expected exactly one protocol manifest"
          assert json.loads(manifests[0].read_text()) == {
              "version": 1, "metadata": {"protocol_versions": ["6.0"]}
          }, "Unexpected registry protocol manifest"
          print("All six pre-reviewed ZIPs and exact tested Linux binary match")
          PY

      - name: Recheck release sources and licenses
        shell: bash
        run: |
          set -euo pipefail
          for PLATFORM in linux_amd64 darwin_arm64 windows_amd64; do
            python python/verify_release_sources.py 0.1.0 "$PLATFORM"
          done

      - name: Require signing credentials
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Missing protected GPG_PRIVATE_KEY or PASSPHRASE"
            exit 1
          fi

      - name: Import registered signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Verify registered GPG fingerprint
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          test "${GPG_FINGERPRINT^^}" = "6CD3B9ED3D947A0293F10ACD916CAEC13188EC38"

      - name: Generate and verify release checksums
        working-directory: dist/release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum terraform-provider-tplink_0.1.0_*.zip \
            tplink-provider-sources_0.1.0_*.zip \
            terraform-provider-tplink_0.1.0_manifest.json \
            > terraform-provider-tplink_0.1.0_SHA256SUMS
          sha256sum -c terraform-provider-tplink_0.1.0_SHA256SUMS

      - name: Sign and verify checksums
        working-directory: dist/release
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          gpg --batch --local-user "$GPG_FINGERPRINT" \
            --output terraform-provider-tplink_0.1.0_SHA256SUMS.sig \
            --detach-sign terraform-provider-tplink_0.1.0_SHA256SUMS
          gpg --verify terraform-provider-tplink_0.1.0_SHA256SUMS.sig \
            terraform-provider-tplink_0.1.0_SHA256SUMS

      - name: Publish vetted release
        working-directory: dist/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.0 --title "v0.1.0" \
            --notes "Python provider release; see RELEASING.md for verification steps." \
            terraform-provider-tplink_0.1.0_*.zip \
            tplink-provider-sources_0.1.0_*.zip \
            terraform-provider-tplink_0.1.0_manifest.json \
            terraform-provider-tplink_0.1.0_SHA256SUMS \
            terraform-provider-tplink_0.1.0_SHA256SUMS.sig
