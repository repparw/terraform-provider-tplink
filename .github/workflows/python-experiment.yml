name: Python provider prototype

on:
  push:
    branches:
      - experiment/python-pyvider
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-experiment.yml'

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './python[test]'
      - run: python -m compileall -q python/tplink_py
      - run: pytest -q python/tests
