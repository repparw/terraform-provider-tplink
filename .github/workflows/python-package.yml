name: Python provider frozen executable

on:
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-package.yml'

permissions:
  contents: read

jobs:
  bundle:
    # These platforms require separate native builds. No bundled Python is
    # installed or required on the eventual Terraform user's machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install -e './python[test]'
          python -m pip install 'pyinstaller>=6.14,<7'
      - name: Bundle provider
        run: python python/build_frozen.py
      - name: Verify real Terraform plugin handshake and schemas
        run: python python/validate_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: tplink-python-${{ matrix.platform }}-experiment
          path: dist/python/terraform-provider-tplink*
          retention-days: 7
