name: Python provider frozen executable

on:
  push:
    branches: [experiment/python-pyvider]
    paths:
      - 'python/**'
      - '.github/workflows/python-package.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-package.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Install package and PyInstaller
        run: |
          python -m pip install -e './python[test]'
          python -m pip install 'pyinstaller>=6.14,<7'
      - name: Bundle Python provider into one executable
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name terraform-provider-tplink \
            --distpath dist/python \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --collect-all pyvider \
            --collect-all tplinkrouterc6u \
            --collect-submodules tplink_py \
            --copy-metadata pyvider \
            --copy-metadata tplinkrouterc6u \
            --copy-metadata terraform-provider-tplink-python \
            python/launcher.py
          ls -lh dist/python/terraform-provider-tplink
      - name: Test frozen provider without Python on PATH
        run: |
          dist/python/terraform-provider-tplink --help >/dev/null
          mkdir -p "$RUNNER_TEMP/schema"
          cat > "$RUNNER_TEMP/schema/main.tf" <<'HCL'
          terraform {
            required_providers {
              tplink = {
                source = "local/providers/tplink"
                version = "0.0.0"
              }
            }
          }
          HCL
          cat > "$RUNNER_TEMP/frozen.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "local/providers/tplink" = "$GITHUB_WORKSPACE/dist/python"
            }
            direct {}
          }
          EOF
          cd "$RUNNER_TEMP/schema"
          TF_CLI_CONFIG_FILE="$RUNNER_TEMP/frozen.tfrc" terraform providers schema -json > schema.json
          python - <<'PY'
          import json
          provider = next(iter(json.load(open("schema.json"))["provider_schemas"].values()))
          attrs = provider["provider"]["block"]["attributes"]
          assert {"host", "password", "username", "verify_ssl"} <= attrs.keys()
          assert {"tplink_port_forward", "tplink_dhcp_reservation"} <= provider["resource_schemas"].keys()
          assert {"tplink_router", "tplink_firmware", "tplink_devices",
                  "tplink_dhcp_reservations", "tplink_port_forwards"} <= provider["data_source_schemas"].keys()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tplink-python-linux-amd64-experiment
          path: dist/python/terraform-provider-tplink
          retention-days: 7
