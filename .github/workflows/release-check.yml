name: Release packaging check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check manifest
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("terraform-registry-manifest.json"))
          assert d == {"version": 1, "metadata": {"protocol_versions": ["6.0"]}}
          PY
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check
      - name: Verify unsigned snapshot artifacts
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=sign
      - name: Validate archive, checksum and manifest names
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find dist -maxdepth 1 -name 'terraform-provider-tplink_*_linux_amd64.zip' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'terraform-provider-tplink_*_SHA256SUMS' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'terraform-provider-tplink_*_manifest.json' -print -quit)"
