# Temporary bootstrap workflow. Remove after docs are committed.
name: Bootstrap tfplugindocs

on:
  push:
    branches: [chore/release-docs-pipeline-20261031]

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'repparw/terraform-provider-tplink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Generate reference docs from live schema
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.24.0 generate --provider-name=tplink
      - name: Check generated document inventory
        run: |
          test -f docs/index.md
          test "$(find docs/resources -maxdepth 1 -name '*.md' | wc -l)" -eq 2
          test "$(find docs/data-sources -maxdepth 1 -name '*.md' | wc -l)" -eq 5
      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate registry reference with tfplugindocs"
            git push origin HEAD:chore/release-docs-pipeline-20261031
          fi
