[project]
name = "terraform-provider-tplink-python"
version = "0.0.0"
description = "Experimental Python backend for TP-Link Terraform provider"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "pyvider==0.8.1",
  "tplinkrouterc6u @ git+https://github.com/repparw/TP-Link-Archer-C6U.git@48064d1f0d5d9a3f5b068e570b3fe30dae8a7f4c",
]

[project.scripts]
terraform-provider-tplink = "tplink_py:main"

[project.entry-points."pyvider"]
tplink = "tplink_py"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tplink_py"]

[tool.pyvider]
provider_name = "tplink"

[project.optional-dependencies]
test = ["pytest>=8"]
