[project]
name = "terraform-provider-tplink-python"
version = "0.0.0"
description = "TP-Link Terraform/OpenTofu provider implemented with Pyvider"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "pyvider==0.8.1",
  "tplinkrouterc6u @ git+https://github.com/repparw/TP-Link-Archer-C6U.git@588f74f57a35e3818deb40825c8788d0240a2f62",
]

[project.scripts]
terraform-provider-tplink = "tplink_py:main"

[project.entry-points."pyvider"]
tplink = "tplink_py"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tplink_py"]

[tool.pyvider]
provider_name = "tplink"

[project.optional-dependencies]
test = ["pytest>=8"]
